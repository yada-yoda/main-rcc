# Collect theatre casting news for rizzo.cc/news (Stage Wire).
#
# Reads the free RSS sources in news-src/feeds.json, files each story by city,
# tier and type, looks up names on Wikidata, and writes news-src/data/. No
# keys, no accounts, no paid services - the whole point of the design.
#
# Twice a day, morning and evening US Central. The run writes nothing if
# nothing changed, so a quiet day leaves no commit behind.
#
# This workflow writes only under news-src/data/, so it can never disturb the
# blog, the acting site at the domain root, or the mirror coming in from the
# dev repo.

name: News ingest

on:
  schedule:
    # 13:00 and 23:00 UTC - early morning and early evening US Central, which
    # is where the Chicago half of the coverage lives. Twice is enough: these
    # outlets publish in business hours, the feeds hold far more than a day of
    # items, and nothing here is time-critical.
    - cron: "0 13,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify and report without writing anything"
        type: boolean
        default: false

permissions:
  contents: write

# The acting mirror and the blog build also push to this repo. Serializing the
# ingest and rebasing right before the push keeps them out of each other's way.
concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feed health
        working-directory: news-src
        # Informational: one dead outlet should not stop the run, but the
        # reason a quiet day was quiet should be in the log.
        continue-on-error: true
        run: python check_feeds.py

      - name: Ingest
        working-directory: news-src
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python ingest.py --dry-run
          else
            python ingest.py
          fi

      - name: Commit data if it changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain news-src/data)" ]; then
            echo "No new stories."
            exit 0
          fi
          git add news-src/data
          git commit -m "News: ingest $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
